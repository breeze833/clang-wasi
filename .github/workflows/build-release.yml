name: Build and Release WASI Toolchain

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Git release tag to create (e.g. v19.1.0). If empty, build and test only.'
        required: false
        type: string
        default: ''
      draft:
        description: 'Create release as a draft'
        required: false
        type: boolean
        default: false
      prerelease:
        description: 'Mark release as pre-release'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    name: Build & Test WASI Toolchain
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build clang lld binaryen

      - name: Setup Node.js (WASI test runtime)
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build Clang and LLD WASM toolchain
        run: |
          chmod +x scripts/build.sh
          ./scripts/build.sh

      - name: Run Test Suite
        run: |
          chmod +x scripts/test.sh scripts/wasi-run.js
          ./scripts/test.sh

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: clang-wasi-artifacts
          path: |
            dist/llvm-box.wasm
            dist/sysroot.tar.gz
            dist/wasi-host.js
            clang-wasi-19.tar.gz
          if-no-files-found: error

      - name: Reset Rolling Tag 'latest'
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          gh release delete latest --cleanup-tag --yes || true
          git push origin :refs/tags/latest 2>/dev/null || true
          git tag -d latest 2>/dev/null || true
          sleep 2
          git tag -f latest
          git push --force origin latest

      - name: Publish Latest Pre-release (Push to main)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          target_commitish: ${{ github.sha }}
          name: "clang-wasi latest (rolling build)"
          body: |
            Automated continuous build from commit `${{ github.sha }}` on `main`.

            ### 📦 Downloadable Assets:
            - **`llvm-box.wasm`**: Single unified multicall driver binary (`clang`, `clang++`, `wasm-ld`, `lld`, `llvm-ar`, `llvm-nm`, etc.)
            - **`sysroot.tar.gz`**: Complete standalone sysroot archive containing standard C/C++ headers and static libraries
            - **`dist/wasi-host.js`**: Standalone zero-dependency pure JavaScript WASI Preview 1 host
            - **`clang-wasi-19.tar.gz`**: Distribution archive bundling toolchain components
          prerelease: true
          files: |
            dist/llvm-box.wasm
            dist/sysroot.tar.gz
            dist/wasi-host.js
            clang-wasi-19.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish Versioned Release (Git Tag or Dispatch)
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          name: ${{ inputs.release_tag || github.ref_name }}
          draft: ${{ inputs.draft || false }}
          prerelease: ${{ inputs.prerelease || false }}
          generate_release_notes: true
          files: |
            dist/llvm-box.wasm
            dist/sysroot.tar.gz
            dist/wasi-host.js
            clang-wasi-19.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


