name: Build and Release WASI Toolchain

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Git release tag to create (e.g. v19.1.0). Leave empty to use package.json version.'
        required: false
        type: string
        default: ''
      draft:
        description: 'Create release as a draft'
        required: false
        type: boolean
        default: false
      prerelease:
        description: 'Mark release as pre-release'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    name: Build & Test WASI Toolchain
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build clang lld binaryen

      - name: Setup Node.js (WASI test runtime)
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build Clang and LLD WASM toolchain
        run: |
          chmod +x scripts/build.sh
          ./scripts/build.sh

      - name: Run Test Suite
        run: |
          npm test
          chmod +x scripts/test.sh scripts/wasi-run.js
          ./scripts/test.sh

      - name: Package npm distribution tarball
        run: |
          npm run pack

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: clang-wasi-artifacts
          path: |
            dist/llvm-box.wasm
            dist/sysroot.tar.gz
            dist/wasi-host.js
            dist/*.tgz
            clang-wasi-19.tar.gz
          if-no-files-found: error

      - name: Determine Release Tag
        id: vars
        run: |
          if [ -n "${{ inputs.release_tag }}" ]; then
            TAG="${{ inputs.release_tag }}"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${{ github.ref_name }}"
          else
            VERSION=$(node -p "require('./package.json').version")
            TAG="v${VERSION}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Release tag: ${TAG}"

      - name: Publish Versioned Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ steps.vars.outputs.tag }}
          draft: ${{ inputs.draft || false }}
          prerelease: ${{ inputs.prerelease || false }}
          generate_release_notes: true
          files: |
            dist/llvm-box.wasm
            dist/sysroot.tar.gz
            dist/wasi-host.js
            dist/*.tgz
            clang-wasi-19.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Switch 'latest' tag to newest build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f latest "${{ github.sha }}"
          git push --force origin refs/tags/latest
